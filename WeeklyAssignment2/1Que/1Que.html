<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Enquiry & Feedback</title>
    <link rel="stylesheet" href="1Que.css">
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h1>Insurance Enquiry & Feedback</h1>
            <p class="description">We are here to help! Please share your policy-related queries and feedback with us.</p>
            
            <div id="successMessage" class="success-message"></div>
            
            <form id="enquiryForm">
                
                <div class="form-group">
                    <label for="fullName">Full Name <span class="required">*</span></label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">
                    <small class="error-message" id="fullNameError"></small>
                </div>

                
                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address">
                    <small class="error-message" id="emailError"></small>
                </div>

                
                <div class="form-group">
                    <label for="mobile">Mobile Number <span class="required">*</span></label>
                    <input type="tel" id="mobile" name="mobile" placeholder="Enter 10-digit mobile number">
                    <small class="error-message" id="mobileError"></small>
                </div>

                
                <div class="form-group">
                    <label for="requestType">Request Type <span class="required">*</span></label>
                    <select id="requestType" name="requestType">
                        <option value="">-- Select Request Type --</option>
                        <option value="Policy Enquiry">Policy Enquiry</option>
                        <option value="Claim Related">Claim Related</option>
                        <option value="Feedback">Feedback</option>
                    </select>
                    <small class="error-message" id="requestTypeError"></small>
                </div>

              
                <div class="form-group">
                    <label for="policyType">Policy Type <span class="required">*</span></label>
                    <select id="policyType" name="policyType">
                        <option value="">-- Select Policy Type --</option>
                        <option value="Health Insurance">Health Insurance</option>
                        <option value="Life Insurance">Life Insurance</option>
                        <option value="Vehicle Insurance">Vehicle Insurance</option>
                        <option value="Home Insurance">Home Insurance</option>
                    </select>
                    <small class="error-message" id="policyTypeError"></small>
                </div>

                
                <div class="form-group">
                    <label for="message">Message <span class="required">*</span></label>
                    <textarea id="message" name="message" placeholder="Please provide your detailed message (minimum 10 characters)" rows="5"></textarea>
                    <small class="error-message" id="messageError"></small>
                </div>

                
                <div class="form-group">
                    <label>Experience Rating <span class="required">*</span></label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="rating" value="1"> 1 - Poor
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="rating" value="2"> 2 - Fair
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="rating" value="3"> 3 - Good
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="rating" value="4"> 4 - Very Good
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="rating" value="5"> 5 - Excellent
                        </label>
                    </div>
                    <small class="error-message" id="ratingError"></small>
                </div>

                
                <button type="submit" class="submit-btn">Submit Enquiry</button>
            </form>
        </div>
    </div>

    <script src="1Que.js"></script>
</body>
</html>
