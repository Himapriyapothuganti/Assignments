<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor</title>
    <!-- <link rel="stylesheet" href="./styles/style2.css"> -->
    <script src="https://cdn.tailwindcss.com"></script>


     
</head>
<body>
    <div class="grid grid-cols-[3fr_1.2fr] max-[834px]:grid-cols-1 gap-[32px] p-[32px]">
           
        <div class="Container">
            <h1 class="text-[32px] font-bold p-[10px]">Desserts</h1>
            <div class="grid grid-cols-3 max-[834px]:grid-cols-2 gap-[28px] bg-transparen">
            <div class="bg-white p-[16px] flex flex-col items-center min-h-[350px] gap-[10px] rounded-[18px] shadow-[1px_1px_18px_grey]">
                <img src="./images/cheesecake.jpg" alt="Cheesecake" width="300px" height="300px" class="w-full h-[200px] object-cover rounded-[14px]">
                <p class ="text-[16px] font-semibold">Cheesecake</p>
                <button class="bg-[#ff9900ba] text-white py-[12px] px-[24px] border-none rounded-[25px] font-bold text-[16px] cursor-pointer flex items-center gap-[10px] transition-[background-color_0.3s_ease,transform_0.2s] hover:bg-[#e68a00] hover:-translate-y-[2px] active:translate-y-0 mt-auto w-fit">
                <span class="btn-icon">🛒</span>
                <span class="btn-text">Add to Cart</span>
                </button>

        

            </div>
            <div class="bg-white p-[16px] flex flex-col items-center min-h-[350px] gap-[10px] rounded-[18px] shadow-[1px_1px_18px_grey]" >
                <img src="./images/brownie.jpg" alt="Cheesecake" width="300px" height="300px" class="w-full h-[200px] object-cover rounded-[14px]">
                <p class ="text-[16px] font-semibold">Brownie</p>
                <button class="bg-[#ff9900ba] text-white py-[12px] px-[24px] border-none rounded-[25px] font-bold text-[16px] cursor-pointer flex items-center gap-[10px] transition-[background-color_0.3s_ease,transform_0.2s] hover:bg-[#e68a00] hover:-translate-y-[2px] active:translate-y-0 mt-auto w-fit">
                <span class="btn-icon">🛒</span>
                <span class="btn-text">Add to Cart</span>
                </button>
            </div>
            <div class="bg-white p-[16px] flex flex-col items-center  min-h-[350px] gap-[10px] rounded-[18px] shadow-[1px_1px_18px_grey]">
               <img src="./images/waffle.jpg" alt="Cheesecake" width="300px" height="300px" class="w-full h-[200px] object-cover rounded-[14px]">
               <p class ="text-[16px] font-semibold">Waffle</p>
               <button class="bg-[#ff9900ba] text-white py-[12px] px-[24px] border-none rounded-[25px] font-bold text-[16px] cursor-pointer flex items-center gap-[10px] transition-[background-color_0.3s_ease,transform_0.2s] hover:bg-[#e68a00] hover:-translate-y-[2px] active:translate-y-0 mt-auto w-fit">
                <span class="btn-icon">🛒</span>
                <span class="btn-text">Add to Cart</span>
                </button>
            </div>
            <div class="bg-white p-[16px] flex flex-col items-center  min-h-[350px] gap-[10px] rounded-[18px] shadow-[1px_1px_18px_grey]">
                <img src="./images/cupcake.jpg" alt="Cheesecake" width="300px" height="300px"  class="w-full h-[200px] object-cover rounded-[14px]">
                <p class ="text-[16px] font-semibold">Cupcake</p>
                 
                <button class="bg-[#ff9900ba] text-white py-[12px] px-[24px] border-none rounded-[25px] font-bold text-[16px] cursor-pointer flex items-center gap-[10px] transition-[background-color_0.3s_ease,transform_0.2s] hover:bg-[#e68a00] hover:-translate-y-[2px] active:translate-y-0 mt-auto w-fit">
                <span class="btn-icon">🛒</span>
                <span class="btn-text">Add to Cart</span>
                </button>
            </div>
            <div class="bg-white p-[16px] flex flex-col items-center min-h-[350px] gap-[10px] rounded-[18px] shadow-[1px_1px_18px_grey]">
               <img src="./images/tiramisu.jpg" alt="Cheesecake" width="300px" height="300px"  class="w-full h-[200px] object-cover rounded-[14px]">
               <p class ="text-[16px] font-semibold">Tiramisu</p>
               <button class="bg-[#ff9900ba] text-white py-[12px] px-[24px] border-none rounded-[25px] font-bold text-[16px] cursor-pointer flex items-center gap-[10px] transition-[background-color_0.3s_ease,transform_0.2s] hover:bg-[#e68a00] hover:-translate-y-[2px] active:translate-y-0 mt-auto w-fit">
                <span class="btn-icon">🛒</span>
                <span class="btn-text">Add to Cart</span>
                </button>
            </div>
            <div class="bg-white p-[16px] flex flex-col items-center  min-h-[350px] gap-[10px] rounded-[18px] shadow-[1px_1px_18px_grey]">
                <img src="./images/macaroons.jpg" alt="Cheesecake" width="300px" height="300px"  class="w-full h-[200px] object-cover rounded-[14px]">
                <p class ="text-[16px] font-semibold">Macaroons</p>
                <button class="bg-[#ff9900ba] text-white py-[12px] px-[24px] border-none rounded-[25px] font-bold text-[16px] cursor-pointer flex items-center gap-[10px] transition-[background-color_0.3s_ease,transform_0.2s] hover:bg-[#e68a00] hover:-translate-y-[2px] active:translate-y-0 mt-auto w-fit">
                <span class="btn-icon">🛒</span>
                <span class="btn-text">Add to Cart</span>
                </button>
                
            </div>
            </div>
        </div>    
        <div class="bg-[#ff9900ba] rounded-[20px] p-[28px] h-[250px] max-[834px]:h-[300px]">
            <div class="cart">
                <h2 class="cart-title">Your Cart (0)</h2>

                <div class="cart-empty">
                    <img src="./images/carticon.jpg" alt="Empty Cart" style="width: 100px">
                    <p>Your added items will appear here</p>
                </div>

  <div class="cart-footer">
    <div class="cart-total">
      <span>Order total</span>
      <strong>$0.00</strong>
    </div>
  </div>
</div>
        </div>
    </div>
    
</body>
</html>
