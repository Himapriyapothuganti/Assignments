<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="tictac.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Tic Tac Toe</h1>
            <p class="subtitle">Challenge yourself against the AI</p>
        </header>

        <div class="game-wrapper">
            <div class="game-info">
                <div class="player-section">
                    <h2>Player 1</h2>
                    <p class="score" id="player1Score">Wins: 0</p>
                </div>
                <div class="status-section">
                    <h2 id="gameStatus">Player 1 Turn</h2>
                    <p class="status-detail" id="statusDetail">X</p>
                </div>
                <div class="ai-section">
                    <h2>Player 2</h2>
                    <p class="score" id="player2Score">Wins: 0</p>
                </div>
            </div>

            <div class="game-board" id="gameBoard">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <div class="game-controls">
                <button class="btn btn-reset" id="resetBtn">New Game</button>
                <button class="btn btn-restart" id="restartBtn">Reset Scores</button>
            </div>
        </div>
    </div>

    <script src="tictac.js"></script>
</body>
</html>
