<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor</title>
    <link rel="stylesheet" href="./styles/style2.css">
</head>
<body>
    <div class="Main">
           
        <div class="Container">
            <h1 style="padding: 10px;">Desserts</h1>
            <div class="One">
            <div class="p1">
                <img src="./images/cheesecake.jpg" alt="Cheesecake" width="300px" height="300px">
                <p>Cheesecake</p>
                <button class="add-to-cart-btn">
                <span class="btn-icon">🛒</span>
                <span class="btn-text">Add to Cart</span>
                </button>


            </div>
            <div class="p2" >
                <img src="./images/brownie.jpg" alt="Cheesecake" width="300px" height="300px">
                <p>Brownie</p>
                <button class="add-to-cart-btn">
                <span class="btn-icon">🛒</span>
                <span class="btn-text">Add to Cart</span>
                </button>
            </div>
            <div class="p3">
               <img src="./images/waffle.jpg" alt="Cheesecake" width="300px" height="300px">
               <p>Waffle</p>
               <button class="add-to-cart-btn">
                <span class="btn-icon">🛒</span>
                <span class="btn-text">Add to Cart</span>
                </button>
            </div>
            <div class="p4">
                <img src="./images/cupcake.jpg" alt="Cheesecake" width="300px" height="300px">
                <p>Cupcake</p>
                 
                <button class="add-to-cart-btn">
                <span class="btn-icon">🛒</span>
                <span class="btn-text">Add to Cart</span>
                </button>
            </div>
            <div class="p5">
               <img src="./images/tiramisu.jpg" alt="Cheesecake" width="300px" height="300px">
               <p>Tiramisu</p>
               <button class="add-to-cart-btn">
                <span class="btn-icon">🛒</span>
                <span class="btn-text">Add to Cart</span>
                </button>
            </div>
            <div class="p6">
                <img src="./images/macaroons.jpg" alt="Cheesecake" width="300px" height="300px">
                <p>Macaroons</p>
                <button class="add-to-cart-btn">
                <span class="btn-icon">🛒</span>
                <span class="btn-text">Add to Cart</span>
                </button>
                
            </div>
            </div>
        </div>    
        <div class="Two">
            <div class="cart">
                <h2 class="cart-title">Your Cart (0)</h2>

                <div class="cart-empty">
                    <img src="./images/carticon.jpg" alt="Empty Cart" style="width: 100px; height: 100px;;">
                    <p>Your added items will appear here</p>
                </div>

  <div class="cart-footer">
    <div class="cart-total">
      <span>Order total</span>
      <strong>$0.00</strong>
    </div>
  </div>
</div>
        </div>
    </div>
    
</body>
</html>
